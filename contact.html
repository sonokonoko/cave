<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | CAVE 若林</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="header" class="scrolled">
    <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">CAVE</a></div>
    <nav>
      <a href="index.html#concept">CONCEPT</a>
      <a href="index.html#rooms">ROOMS</a>
      <a href="index.html#details">DETAILS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <div class="contact-page">
    <div class="contact-page-header">
      <h1>CONTACT</h1>
      <p>内覧予約・お問い合わせ</p>
    </div>

    <div class="contact-page-content">
      <div class="contact-intro">
        <p>CAVE若林へのお問い合わせは、下記フォームよりお願いいたします。</p>
        <p>担当者より2営業日以内にご連絡させていただきます。</p>
      </div>

      <form id="contactForm" class="contact-form-page">
        <div class="form-row">
          <div class="form-group">
            <label for="name">お名前 <span class="required">*</span></label>
            <input type="text" id="name" name="name" required placeholder="山田 太郎">
          </div>
          
          <div class="form-group">
            <label for="furigana">ふりがな <span class="required">*</span></label>
            <input type="text" id="furigana" name="furigana" required placeholder="やまだ たろう">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
          </div>
          
          <div class="form-group">
            <label for="phone">電話番号 <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required placeholder="090-1234-5678">
          </div>
        </div>

        <div class="form-group">
          <label for="room">ご希望の部屋</label>
          <select id="room" name="room">
            <option value="">選択してください</option>
            <option value="ROOM A">ROOM A (1F/2F, 109㎡, 2LDK)</option>
            <option value="ROOM B">ROOM B (1F/2F, 100㎡, 2LDK)</option>
            <option value="ROOM C">ROOM C (1F/2F, 104㎡, 2LDK)</option>
            <option value="ROOM D">ROOM D (2F/3F, 158㎡, 3LDK)</option>
            <option value="ROOM E">ROOM E (2F/3F, 142㎡, 3LDK)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="inquiry-type">お問い合わせ種別 <span class="required">*</span></label>
          <select id="inquiry-type" name="inquiry-type" required>
            <option value="">選択してください</option>
            <option value="内覧予約">内覧予約</option>
            <option value="物件について">物件について</option>
            <option value="契約について">契約について</option>
            <option value="その他">その他</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">お問い合わせ内容 <span class="required">*</span></label>
          <textarea id="message" name="message" rows="8" required placeholder="具体的なご質問やご要望をご記入ください"></textarea>
        </div>

        <div class="form-privacy">
          <label class="privacy-label">
            <input type="checkbox" id="privacy" name="privacy" required>
            <span><a href="#" target="_blank">プライバシーポリシー</a>に同意する <span class="required">*</span></span>
          </label>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="submit-button">送信する</button>
        </div>
        
        <div id="formMessage" class="form-message"></div>
      </form>

      <div class="contact-info-section">
        <h3>その他のお問い合わせ方法</h3>
        <div class="contact-info-grid">
          <div class="contact-info-item">
            <h4>電話でのお問い合わせ</h4>
            <p class="contact-detail">TEL: 03-XXXX-XXXX</p>
            <p class="contact-note">受付時間: 10:00〜18:00（水曜定休）</p>
          </div>
          <div class="contact-info-item">
            <h4>メールでのお問い合わせ</h4>
            <p class="contact-detail">info@cave-setagaya.com</p>
            <p class="contact-note">2営業日以内にご返信いたします</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 CAVE WAKABAYASHI. ALL RIGHTS RESERVED.</p>
  </footer>

  <script src="./contact.js"></script>
</body>
</html>
